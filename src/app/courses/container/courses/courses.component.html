<mat-card>
  <mat-card-content>
    <mat-toolbar color="primary">Cursos Disponíveis</mat-toolbar>
    @if (Courses$|async; as courses) {
      <app-courses-list
        [Courses]="courses"
        (add)="onAdd()"
        (edit)="onEdit($event)"
        (remove)="onRemove($event)"
      ></app-courses-list>
    } @else {
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    }
    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    </ng-template>
  </mat-card-content>
</mat-card>
