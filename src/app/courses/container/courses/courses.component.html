<mat-card>
  <mat-card-content>
    <mat-toolbar color="primary">Cursos Disponíveis</mat-toolbar>
    <app-courses-list *ngIf="Courses$|async as courses;else loading"
    [Courses]="courses"
     (add)="onAdd()"
     (edit)="onEdit($event)"
     (remove)="onRemove($event)"
    ></app-courses-list>
    <ng-template #loading>
      <div class="loading-spinner">
      <mat-spinner></mat-spinner>
      </div>
    </ng-template>
  </mat-card-content>
</mat-card>
