<mat-dialog-content>
  <p>{{data}}</p>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-raised-button color="primary" (click)="onConfirm(true)" class="botao">Sim</button>
  <button mat-raised-button color="warn" (click)="onConfirm(false)" class="cancelar">Não</button>
</mat-dialog-actions>
